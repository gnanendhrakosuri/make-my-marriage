<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A7736"/>
    </linearGradient>
    <linearGradient id="velvetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#641622"/>
      <stop offset="100%" stop-color="#4A121A"/>
    </linearGradient>
  </defs>

  <!-- Background Atelier Roundel -->
  <rect width="32" height="32" rx="8" fill="url(#velvetGradient)"/>

  <!-- Left Wedding Ring -->
  <circle cx="12.5" cy="16.5" r="5.5" fill="none" stroke="url(#goldGradient)" stroke-width="1.8"/>

  <!-- Right Wedding Ring (Interlocked) -->
  <circle cx="19.5" cy="16.5" r="5.5" fill="none" stroke="url(#goldGradient)" stroke-width="1.8"/>

  <!-- Sparkling Solitaire Diamond on Ring Crown -->
  <path d="M 19.5 9.5 L 21 11 L 19.5 12.5 L 18 11 Z" fill="#FFFDF9" stroke="url(#goldGradient)" stroke-width="0.5"/>
  <circle cx="19.5" cy="11" r="0.8" fill="#FFFDF9"/>
</svg>
